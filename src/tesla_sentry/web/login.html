<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151618">
<title>__L_LOGIN__ · __L_BRAND__</title>
<script>try{var theme=localStorage.getItem('tsf_theme');if(theme==='light'||theme==='dark')document.documentElement.dataset.theme=theme;}catch(e){}</script>
<style>
:root{color-scheme:light;--bg:#f6f7f9;--surface:#fff;--input:#fafbfc;--text:#202329;--muted:#686d78;--line:#e2e4e9;--accent:#bf423e;--fill:#bf423e;--soft:rgba(201,72,67,.08);--shadow:0 18px 70px rgba(30,35,45,.06)}
@media(prefers-color-scheme:dark){html:not([data-theme="light"]){color-scheme:dark;--bg:#111214;--surface:#1b1c1f;--input:#161719;--text:#f3f3f4;--muted:#a3a5ad;--line:#34363d;--accent:#ec625b;--fill:#be4841;--soft:rgba(236,98,91,.1);--shadow:0 18px 70px rgba(0,0,0,.14)}}
html[data-theme="dark"]{color-scheme:dark;--bg:#111214;--surface:#1b1c1f;--input:#161719;--text:#f3f3f4;--muted:#a3a5ad;--line:#34363d;--accent:#ec625b;--fill:#be4841;--soft:rgba(236,98,91,.1);--shadow:0 18px 70px rgba(0,0,0,.14)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font:14px/1.65 -apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Segoe UI','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased;padding:48px 32px}
.login-layout{display:grid;grid-template-columns:1.15fr 1fr;gap:96px;align-items:center;width:100%;max-width:1020px}
.brand{display:flex;align-items:center;gap:12px}.brand svg{width:33px;height:36px;color:var(--accent);flex:none}.brand strong{display:block;font-size:16px;font-weight:600;letter-spacing:.5px;line-height:1.4}.brand small{display:block;color:var(--muted);font-size:8px;letter-spacing:2.7px;margin-top:4px}
.intro h1{font-size:44px;font-weight:580;line-height:1.4;letter-spacing:-1.3px;max-width:410px;margin:48px 0 23px}.intro h1 span{display:block}.intro p{font-size:12px;color:var(--muted);line-height:1.9;margin:0}.local-note{display:flex;align-items:center;gap:8px;margin-top:66px;color:var(--muted);font-size:11px}.local-note svg{width:15px;height:15px}
.card{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:39px 36px 25px;box-shadow:var(--shadow)}.eyebrow{font-size:9px;font-weight:600;color:var(--muted);letter-spacing:2px;margin:0 0 11px}.card h2{font-size:26px;font-weight:600;letter-spacing:-.6px;line-height:1.3;margin:0 0 10px}.sub{font-size:12px;color:var(--muted);margin:0 0 31px}
label{display:block;font-size:11px;color:var(--muted);margin:18px 0 9px}input{width:100%;min-height:47px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--input);color:var(--text);font-family:inherit;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}button{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:47px;margin-top:27px;border:0;border-radius:10px;cursor:pointer;background:var(--fill);color:#fff;font:500 13px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}button svg{width:16px;height:16px}button:hover{filter:brightness(.95)}button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.err{font-size:12px;color:var(--accent);min-height:19px;margin-top:13px;overflow-wrap:anywhere}.foot{border-top:1px solid var(--line);padding-top:20px;margin-top:13px;font-size:10px;color:var(--muted);line-height:1.8;text-align:center}
@media(max-width:800px){.login-layout{gap:40px}.intro h1{font-size:34px}.card{padding:31px 25px 22px}.local-note{margin-top:40px}}
@media(max-width:620px){body{padding:35px 22px}.login-layout{max-width:390px;display:block}.intro{margin-bottom:30px}.intro h1,.intro p,.local-note{display:none}.brand{justify-content:center}.brand strong{font-size:15px}.card{border-radius:21px;padding:30px 26px 23px}.card h2{font-size:25px}.sub{margin-bottom:24px}input{font-size:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<main class="login-layout">
  <section class="intro">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 8 3v6c0 4.4-4.7 7.7-8 9-3.3-1.3-8-4.6-8-9V6l8-3Z"/><path d="m8.5 12 2.3 2.3 4.8-5"/></svg><span><strong>__L_BRAND__</strong><small>SENTRY DRIVE</small></span></div>
    <h1><span>__L_TAGLINE_A__</span><span>__L_TAGLINE_B__</span></h1><p>__L_FEATURES__</p>
    <div class="local-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span>__L_LOCAL__</span></div>
  </section>
  <form class="card" method="post" action="/login">
    <p class="eyebrow">YOUR PRIVATE ARCHIVE</p><h2>__L_WELCOME__</h2><p class="sub">__L_SUBTITLE__</p>
    <label for="login-user">__L_USER__</label>
    <input id="login-user" name="u" autocomplete="username" autocapitalize="none" autocorrect="off" value="__USER__" required>
    <label for="login-pass">__L_PASS__</label>
    <input id="login-pass" name="p" type="password" autocomplete="current-password" required>
    <input type="hidden" name="next" value="__NEXT__">
    <button type="submit"><span>__L_LOGIN__</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button>
    <div class="err" role="alert" aria-live="polite">__MSG__</div><div class="foot">__L_FOOT__</div>
  </form>
</main></body></html>
